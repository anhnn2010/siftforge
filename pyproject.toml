[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "siftforge"
version = "0.1.0"
description = "Reusable Python data extraction pipeline with validation, fallback strategies, and cost-aware AI routing."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
authors = [{name = "SiftForge contributors"}]
dependencies = [
    "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
gemini = [
    "google-genai>=1,<2",
]

[project.scripts]
siftforge = "siftforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["ANN", "B", "D", "E", "F", "I", "UP"]
ignore = [
    # Generic extraction payloads legitimately cross typed/untyped boundaries.
    "ANN401",
]

[tool.ruff.lint.pydocstyle]
convention = "google"
